name: Repair security lockfile
on:
  push:
    branches: [fix/dependabot-body-parser-security]
    paths: [.github/workflows/repair-security-lock.yml]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dependabot-body-parser-security
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile without install scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify reproducible installation without install scripts
        run: npm ci --ignore-scripts
      - name: Verify body-parser versions
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const lock = require('./package-lock.json');
          const entries = Object.entries(lock.packages).filter(([p]) => p.endsWith('node_modules/body-parser'));
          assert(entries.length > 0, 'body-parser missing from lockfile');
          for (const [p, pkg] of entries) assert.equal(pkg.version, '1.20.6', p);
          NODE
      - name: Commit only generated lockfile to fix branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(security): regenerate lockfile for body-parser 1.20.6'
            git push origin HEAD:refs/heads/fix/dependabot-body-parser-security
          fi
